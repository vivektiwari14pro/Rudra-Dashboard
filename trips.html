<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Trips | Rudra</title><link rel='stylesheet' href='style.css'></head><body><header class='top'><div class='brand'>🚚 Rudra Transport<small>Rudraksha Enterprises • Logistics Management</small></div><div><a class='btn' href='reports.html'>📑 Reports</a> <a class='btn primary' href='trips.html'>+ New Trip</a></div></header><div class='layout'><nav><a class='nav ' href='index.html'>📊 Dashboard</a><a class='nav active' href='trips.html'>🚚 Trips</a><a class='nav ' href='vehicles.html'>🚛 Vehicles</a><a class='nav ' href='transporters.html'>👥 Transporters</a><a class='nav ' href='locations.html'>📍 Locations</a><a class='nav ' href='reports.html'>📑 Reports</a></nav><main><h1 class='title'>Trips</h1><p class='subtitle'>Trip register with commercial and compliance details</p><div class='filters'><input id='q' placeholder='Search trip / vehicle / challan'><select id='u'><option value=''>All locations</option></select><select id='t'><option value=''>All transporters</option></select><select id='s'><option value=''>All status</option><option>Completed</option><option>In Transit</option><option>Pending</option></select></div><div class='tablebox'><table><thead><tr><th>Trip</th><th>Date</th><th>Vehicle</th><th>Transporter</th><th>Route</th><th>Gate Pass</th><th>Challan</th><th>Load</th><th>Unload</th><th>Shortage</th><th>HSD</th><th>GPS</th><th>Fastag</th><th>Status</th></tr></thead><tbody id='rows'></tbody></table></div></main></div><script>const trips=[{tripId:'TR-1001',date:'2026-09-18',vehicleNo:'UP64BT1234',transporter:'Rudra Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Ghazipur',gatePassNo:'GP-901',challanNo:'CH-501',loadingQty:30,unloadingQty:29.6,freight:18500,cashAdvance:3000,bankAdvance:2000,deductions:300,hsdSlipNo:'HSD-701',gps:'Verified',fastag:'Verified',status:'Completed'},{tripId:'TR-1002',date:'2026-09-18',vehicleNo:'UP64CT5678',transporter:'Shiv Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Jaunpur',gatePassNo:'GP-902',challanNo:'CH-502',loadingQty:31,unloadingQty:30.7,freight:21000,cashAdvance:4000,bankAdvance:0,deductions:250,hsdSlipNo:'HSD-702',gps:'Verified',fastag:'Verified',status:'In Transit'},{tripId:'TR-1003',date:'2026-09-19',vehicleNo:'UP64DT7788',transporter:'Rudra Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Karimuddinpur',gatePassNo:'GP-903',challanNo:'CH-503',loadingQty:30,unloadingQty:29.8,freight:17500,cashAdvance:2500,bankAdvance:2500,deductions:200,hsdSlipNo:'HSD-703',gps:'Verified',fastag:'Pending',status:'Completed'},{tripId:'TR-1004',date:'2026-09-20',vehicleNo:'UP64ET8899',transporter:'Maa Logistics',loadingLocation:'Vindhyanagar',unloadingLocation:'Ghazipur',gatePassNo:'GP-904',challanNo:'CH-504',loadingQty:32,unloadingQty:0,freight:19000,cashAdvance:2000,bankAdvance:1000,deductions:0,hsdSlipNo:'HSD-704',gps:'Pending',fastag:'Verified',status:'Pending'},{tripId:'TR-1005',date:'2026-09-20',vehicleNo:'UP64FT9900',transporter:'Shiv Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Jaunpur',gatePassNo:'GP-905',challanNo:'CH-505',loadingQty:31,unloadingQty:30.5,freight:21000,cashAdvance:3500,bankAdvance:1500,deductions:300,hsdSlipNo:'HSD-705',gps:'Verified',fastag:'Verified',status:'Completed'}];</script><script>let current=trips;function render(){let q=document.getElementById('q').value.toLowerCase(),u=document.getElementById('u').value,t=document.getElementById('t').value,s=document.getElementById('s').value;current=trips.filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!u||x.unloadingLocation==u)&&(!t||x.transporter==t)&&(!s||x.status==s));document.getElementById('rows').innerHTML=current.map(x=>'<tr><td>'+x.tripId+'</td><td>'+x.date+'</td><td>'+x.vehicleNo+'</td><td>'+x.transporter+'</td><td>'+x.loadingLocation+' → '+x.unloadingLocation+'</td><td>'+x.gatePassNo+'</td><td>'+x.challanNo+'</td><td>'+x.loadingQty+'</td><td>'+x.unloadingQty+'</td><td>'+((x.loadingQty-x.unloadingQty).toFixed(1))+'</td><td>'+x.hsdSlipNo+'</td><td>'+x.gps+'</td><td>'+x.fastag+'</td><td><span class="badge '+x.status.replace(' ','')+'">'+x.status+'</span></td></tr>').join('')}function fill(id,a){a.forEach(v=>document.getElementById(id).innerHTML+='<option>'+v+'</option>')}fill('u',[...new Set(trips.map(x=>x.unloadingLocation))]);fill('t',[...new Set(trips.map(x=>x.transporter))]);['q','u','t','s'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
