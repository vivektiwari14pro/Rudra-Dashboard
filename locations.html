<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Locations | Rudra</title><link rel='stylesheet' href='style.css'></head><body><header class='top'><div class='brand'>🚚 Rudra Transport<small>Rudraksha Enterprises • Logistics Management</small></div><div><a class='btn' href='reports.html'>📑 Reports</a> <a class='btn primary' href='trips.html'>+ New Trip</a></div></header><div class='layout'><nav><a class='nav ' href='index.html'>📊 Dashboard</a><a class='nav ' href='trips.html'>🚚 Trips</a><a class='nav ' href='vehicles.html'>🚛 Vehicles</a><a class='nav ' href='transporters.html'>👥 Transporters</a><a class='nav active' href='locations.html'>📍 Locations</a><a class='nav ' href='reports.html'>📑 Reports</a></nav><main><h1 class='title'>Locations</h1><p class='subtitle'>Route-wise movement from loading point to unloading destination</p><div class='grid g4' id='cards'></div><div class='tablebox'><table><thead><tr><th>Loading</th><th>Unloading</th><th>Trips</th><th>Vehicles</th><th>Loaded MT</th><th>Unloaded MT</th><th>Shortage MT</th><th>Freight</th></tr></thead><tbody id='rows'></tbody></table></div></main></div><script>const trips=[{tripId:'TR-1001',date:'2026-09-18',vehicleNo:'UP64BT1234',transporter:'Rudra Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Ghazipur',gatePassNo:'GP-901',challanNo:'CH-501',loadingQty:30,unloadingQty:29.6,freight:18500,cashAdvance:3000,bankAdvance:2000,deductions:300,hsdSlipNo:'HSD-701',gps:'Verified',fastag:'Verified',status:'Completed'},{tripId:'TR-1002',date:'2026-09-18',vehicleNo:'UP64CT5678',transporter:'Shiv Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Jaunpur',gatePassNo:'GP-902',challanNo:'CH-502',loadingQty:31,unloadingQty:30.7,freight:21000,cashAdvance:4000,bankAdvance:0,deductions:250,hsdSlipNo:'HSD-702',gps:'Verified',fastag:'Verified',status:'In Transit'},{tripId:'TR-1003',date:'2026-09-19',vehicleNo:'UP64DT7788',transporter:'Rudra Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Karimuddinpur',gatePassNo:'GP-903',challanNo:'CH-503',loadingQty:30,unloadingQty:29.8,freight:17500,cashAdvance:2500,bankAdvance:2500,deductions:200,hsdSlipNo:'HSD-703',gps:'Verified',fastag:'Pending',status:'Completed'},{tripId:'TR-1004',date:'2026-09-20',vehicleNo:'UP64ET8899',transporter:'Maa Logistics',loadingLocation:'Vindhyanagar',unloadingLocation:'Ghazipur',gatePassNo:'GP-904',challanNo:'CH-504',loadingQty:32,unloadingQty:0,freight:19000,cashAdvance:2000,bankAdvance:1000,deductions:0,hsdSlipNo:'HSD-704',gps:'Pending',fastag:'Verified',status:'Pending'},{tripId:'TR-1005',date:'2026-09-20',vehicleNo:'UP64FT9900',transporter:'Shiv Transport',loadingLocation:'Vindhyanagar',unloadingLocation:'Jaunpur',gatePassNo:'GP-905',challanNo:'CH-505',loadingQty:31,unloadingQty:30.5,freight:21000,cashAdvance:3500,bankAdvance:1500,deductions:300,hsdSlipNo:'HSD-705',gps:'Verified',fastag:'Verified',status:'Completed'}];</script><script>let m={};trips.forEach(x=>{let k=x.loadingLocation+'|'+x.unloadingLocation;if(!m[k])m[k]={load:x.loadingLocation,unload:x.unloadingLocation,trips:0,vehicles:new Set(),qty:0,uq:0,freight:0};let v=m[k];v.trips++;v.vehicles.add(x.vehicleNo);v.qty+=x.loadingQty;v.uq+=x.unloadingQty;v.freight+=x.freight});let a=Object.values(m),money=n=>'₹'+Math.round(n).toLocaleString('en-IN');document.getElementById('cards').innerHTML=[['Loading Locations',new Set(trips.map(x=>x.loadingLocation)).size],['Unloading Locations',new Set(trips.map(x=>x.unloadingLocation)).size],['Routes',a.length],['Total Trips',trips.length]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');document.getElementById('rows').innerHTML=a.map(x=>'<tr><td>'+x.load+'</td><td>'+x.unload+'</td><td>'+x.trips+'</td><td>'+x.vehicles.size+'</td><td>'+x.qty.toFixed(1)+'</td><td>'+x.uq.toFixed(1)+'</td><td>'+((x.qty-x.uq).toFixed(1))+'</td><td>'+money(x.freight)+'</td></tr>').join('');</script></body></html>
